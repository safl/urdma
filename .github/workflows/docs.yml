name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Grab source
      uses: actions/checkout@v7.0.0

    - name: Install pipx and Doxygen
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pipx doxygen

    - name: Install the docs tooling
      run: |
        pipx install ./docs/tooling
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build HTML
      run: make docs

    # As the Pages artifact, which deploy-pages takes from the run; uploaded here
    # rather than in the deploy job, whose deploy-pages did not find an artifact
    # uploaded a second earlier in the same job
    - name: Upload the HTML as the Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/_build/html

  # Pushes to main and runs dispatched on main deploy; pull requests only build
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Configure Pages
      uses: actions/configure-pages@v6

    - id: deployment
      name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5
