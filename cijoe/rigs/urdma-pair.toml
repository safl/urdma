# urdma-pair: two guests, urdma and peer, each with an emulated AMD Pensando
# ionic NIC, the NICs connected to each other, for RDMA between two hosts
# without RDMA hardware. This is systems-devenv's rdma-pair-emulated rig with
# urdma's guest and socket names: each NIC's rocm-ernic server serves one
# guest, and the two servers join rocm-ernic's TCP mesh, nic0's as its manager
# and nic1's as a worker, which carries the RDMA traffic between the guests.
# The mesh routes by GID, so each server is given its guest's GIDs: the
# link-local one the guest derives from the server's --mac, and the IPv4 one of
# 'guest_addr', which tasks/pair.yaml gives the guest. Each NIC's Ethernet goes
# to a TAP on one host bridge, which carries IP between the guests. See
# /opt/systems-devenv/cijoe/scripts/rig.py in the host container for the
# format. tasks/pair.yaml boots it:
#
#   cijoe tasks/pair.yaml --config configs/guest.toml --config rigs/urdma-pair.toml

[rig.devices.nic0]
provider = "vfio-user"
socket = "{{ local.env.HOME }}/run/vfio-user-urdma-pair0.sock"
tap = "urdmatap0"
bridge = "urdmabr0"
server = "env ERNIC_TCP_GUEST_GIDS=fe80::a0:d1ff:fe00:1,192.168.200.10 /opt/rocm-ernic/bin/rocm-ernic --socket {socket} --backend tcp:manager:listen:18600 --mac 02:a0:d1:00:00:01 --tap {tap} --log-level info"

[rig.devices.nic0.transport]
netdev = "rocm-ernic0"
guest_addr = "192.168.200.10/24"

[rig.guests.peer.devices.nic1]
provider = "vfio-user"
socket = "{{ local.env.HOME }}/run/vfio-user-urdma-pair1.sock"
tap = "urdmatap1"
bridge = "urdmabr0"
server = "env ERNIC_TCP_GUEST_GIDS=fe80::a0:d1ff:fe00:2,192.168.200.20 /opt/rocm-ernic/bin/rocm-ernic --socket {socket} --backend tcp:worker:127.0.0.1:18600 --mac 02:a0:d1:00:00:02 --tap {tap} --log-level info"

[rig.guests.peer.devices.nic1.transport]
netdev = "rocm-ernic0"
guest_addr = "192.168.200.20/24"

# The second guest, as configs/guest.toml's urdma guest, on its own SSH port
[qemu.guests.peer]
path = "{{ local.env.HOME }}/guests/urdma-peer"
system_label = "x86_64"
system_args.kwa = {cpu = "host", smp = 4, m = "4G", accel = "kvm"}
system_args.raw = """\
-M "type=q35,kernel_irqchip=split" \
-device "intel-iommu,pt=on,intremap=on,caching-mode=on" \
"""
system_args.tcp_forward = {host = 4201, guest = 22}

[cijoe.targets.peer.ssh]
username = "root"
password = "root"
hostname = "localhost"
port = 4201

[cijoe.targets.peer_odus.ssh]
username = "odus"
password = "odus.321"
hostname = "localhost"
port = 4201
