[project]
name = "urdma-docs"
version = "0.1.0"
description = "Documentation build tooling for urdma"
requires-python = ">=3.11"
authors = [{ name = "Simon A. F. Lund", email = "os@safl.dk" }]
license = "BSD-3-Clause"
dependencies = [
    "sphinx>=8",
    "myst-parser[linkify]>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.10",
    "furo>=2024.8",
    "breathe>=4.35,<5",
]

[project.scripts]
urdma-docs-serve = "urdma_docs.cli:serve"
urdma-docs-build-html = "urdma_docs.cli:build_html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdma_docs"]
